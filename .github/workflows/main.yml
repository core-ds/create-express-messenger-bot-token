name: main

on:
  pull_request:
  push:
    branches:
      - main
      - version/**

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CI
        uses: ./.github/actions/ci-setup

      - name: Lint
        run: |
          yarn lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CI
        uses: ./.github/actions/ci-setup

      - name: Lint
        run: |
          yarn format

  check-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CI
        uses: ./.github/actions/ci-setup

      - name: Check types
        run: |
          yarn check-types

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CI
        uses: ./.github/actions/ci-setup

      - name: Build
        run: |
          yarn build

  ok:
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, build, format, check-types]
    env:
      FAILURE: ${{ contains(join(needs.*.result, ','), 'failure') }}
    steps:
      - name: Check for failure
        run: |
          echo $FAILURE
          if [ "$FAILURE" = "false" ]; then
            exit 0
          else
            exit 1
          fi
